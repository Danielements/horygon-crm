services:
  horygon-crm:
    build: .
    container_name: horygon-crm
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8443:3001"
    volumes:
      - ./uploads:/app/uploads
      - ./horygon.db:/app/horygon.db
    environment:
      - PORT=3001
      - DB_PATH=/app/horygon.db
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - SESSION_SECRET=${SESSION_SECRET}
      - BASE_URL=${BASE_URL}
      - NODE_ENV=${NODE_ENV:-production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_API_VERSION=${WHATSAPP_API_VERSION:-v20.0}
      - PARTS_BACKEND_BASE_URL=${PARTS_BACKEND_BASE_URL}
      - PARTS_BACKEND_API_KEY=${PARTS_BACKEND_API_KEY}
      - RTWS_WSDL_URL=${RTWS_WSDL_URL}
      - RTWS_AZIENDA_NAME=${RTWS_AZIENDA_NAME}
      - RTWS_CLIENT_NAME=${RTWS_CLIENT_NAME}
      - RTWS_PASSWORD=${RTWS_PASSWORD}
      - RTWS_PRODUCT_BDRT=${RTWS_PRODUCT_BDRT}
      - RTWS_PRODUCT_LISTINI=${RTWS_PRODUCT_LISTINI}
      - RTWS_PRODUCT_IDENTIFICATION=${RTWS_PRODUCT_IDENTIFICATION}
      - RTWS_TIMEOUT_MS=${RTWS_TIMEOUT_MS:-12000}
      - RTWS_SESSION_TTL_SECONDS=${RTWS_SESSION_TTL_SECONDS:-600}
