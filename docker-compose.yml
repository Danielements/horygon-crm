services:
  horygon-crm:
    build: .
    container_name: horygon-crm
    restart: unless-stopped
    ports:
      # Solo loopback: il container non deve essere raggiungibile da Internet
      # scavalcando nginx, che e' l'unico punto in cui viene applicato l'mTLS
      # sul canale SdI. Nginx continua a raggiungerlo su 127.0.0.1:8443.
      - "127.0.0.1:8443:3001"
    volumes:
      - ./uploads:/app/uploads
      - ./horygon.db:/app/horygon.db
      - /root/sdi-certs:/run/sdi-certs:ro
    environment:
      - PORT=3001
      - DB_PATH=/app/horygon.db
      - SDI_CERTS_DIR=/run/sdi-certs
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - SESSION_SECRET=${SESSION_SECRET}
      - BASE_URL=${BASE_URL}
      - NODE_ENV=${NODE_ENV:-production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      # Riconciliazione giornaliera SdI: .env dell'host escluso dall'immagine
      # (.dockerignore), quindi le variabili passano da qui.
      - "SDI_DAILY_RECONCILIATION_ENABLED=${SDI_DAILY_RECONCILIATION_ENABLED:-false}"
      - "SDI_DAILY_RECONCILIATION_CRON=${SDI_DAILY_RECONCILIATION_CRON:-0 6 * * *}"
      - "SDI_DAILY_RECONCILIATION_LOOKBACK_DAYS=${SDI_DAILY_RECONCILIATION_LOOKBACK_DAYS:-7}"
      - "SDI_DAILY_RECONCILIATION_OVERLAP_DAYS=${SDI_DAILY_RECONCILIATION_OVERLAP_DAYS:-7}"
