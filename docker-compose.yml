services:
  horygon-crm:
    build: .
    container_name: horygon-crm
    restart: unless-stopped
    ports:
      # Solo loopback: il container non deve essere raggiungibile da Internet
      # scavalcando nginx, che e' l'unico punto in cui viene applicato l'mTLS
      # sul canale SdI. Nginx continua a raggiungerlo su 127.0.0.1:8443.
      - "127.0.0.1:8443:3001"
    volumes:
      - ./uploads:/app/uploads
      - ./horygon.db:/app/horygon.db
      - /root/sdi-certs:/run/sdi-certs:ro
    environment:
      - PORT=3001
      - DB_PATH=/app/horygon.db
      - SDI_CERTS_DIR=/run/sdi-certs
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - SESSION_SECRET=${SESSION_SECRET}
      - BASE_URL=${BASE_URL}
      - NODE_ENV=${NODE_ENV:-production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
